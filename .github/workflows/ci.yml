name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate data
        run: node scripts/validate.mjs
      - run: npm run typecheck
      - run: npm run build
      - name: Generated files are committed
        run: git diff --exit-code -- data/manufacturers.json MANUFACTURERS.md
      - name: Smoke test (initialize + tools/list)
        run: node scripts/smoke-test.mjs
